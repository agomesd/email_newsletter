[package]
name = "email_newsletter"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "email_newsletter"

[dependencies]
actix-web = "4"
config = "0.13"
tokio = {version = "1.43.0", features = ["full"]}
tokio-macros = "~2.5.0"
reqwest = "0.12.12"
serde = { version = "1", features = ["derive"]}

[dependencies.sqlx]
version = "0.7"
default-features = false
features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono", "migrate"]
